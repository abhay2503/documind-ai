[project]
name = "learn-phase1"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.150.1",
    "docling-core[chunking]==2.107.1",
    "docling-hierarchical-pdf==0.2.0",
    "transformers==5.23.0",
    "torch==2.15.0",
    "groq",
    "langchain-aws",
    "langchain-groq",
    "pydantic",
    "boto3==1.44.3",
    "python-dotenv",
]

# CPU-only torch (much smaller download)
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.uv]
package = false
