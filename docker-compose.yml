# Local S3 (LocalStack) for this project (nothing touches real AWS).
# The database is the PostgreSQL server installed on this machine (127.0.0.1:5432), not a container.
#
#   docker compose up -d --wait      # start
#   docker compose down              # stop (all data is thrown away)
name: documind-ai

services:
  s3:
    image: localstack/localstack:4.14.0
    container_name: documind-ai-s3
    ports:
      - "127.0.0.1:4567:4566"
    environment:
      - SERVICES=s3
      - AWS_DEFAULT_REGION=ap-south-1
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(available\\|running\\)\"'"]
      interval: 3s
      timeout: 3s
      retries: 40
